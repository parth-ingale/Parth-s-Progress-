  <script>
    let chaptersData = [];
    let testsData = [];
    let modulesData = [];
    let mistakesData = [];

    function switchTab(tabName) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
      document.querySelectorAll('.tab-btn').forEach(el => {
        el.className = 'tab-btn px-4 py-2 rounded-lg text-sm font-medium text-gray-400 hover:text-white';
      });

      document.getElementById(`view-${tabName}`).classList.remove('hidden');
      const activeBtn = document.getElementById(`tab-${tabName}`);
      activeBtn.className = 'tab-btn px-4 py-2 rounded-lg text-sm font-medium bg-accentPurple/20 text-accentPurple border border-accentPurple/40';
    }

    async function loadData() {
      try {
        const { data: ch } = await supabaseClient.from('chapters').select('*');
        if (ch) chaptersData = ch;

        const { data: ts } = await supabaseClient.from('tests').select('*');
        if (ts) testsData = ts;

        const { data: md } = await supabaseClient.from('modules').select('*');
        if (md) modulesData = md;

        const { data: ms } = await supabaseClient.from('mistakes').select('*');
        if (ms) mistakesData = ms;

        renderDashboard();
        renderChapters();
        renderModules();
        renderTests();
        renderMistakes();
      } catch (err) {
        console.error('Connection error:', err);
      }
    }

    function renderDashboard() {
      const completed = chaptersData.filter(c => c.module && c.pyq && c.test).length;
      const total = chaptersData.length || 1;
      const pct = Math.round((completed / total) * 100);

      document.getElementById('dash-chapters-count').innerText = `${completed}/${total}`;
      document.getElementById('dash-chapters-pct').innerText = `${pct}% complete`;
      document.getElementById('dash-progress-bar').style.width = `${pct}%`;
      document.getElementById('dash-progress-sub').innerText = `${pct}% complete · Keep the streak alive.`;

      document.getElementById('dash-tests-count').innerText = testsData.length;
      document.getElementById('dash-modules-count').innerText = modulesData.length;
      document.getElementById('dash-mistakes-count').innerText = mistakesData.length;
    }

    function renderChapters() {
      const filterClass = document.getElementById('filter-class').value;
      const filterSubject = document.getElementById('filter-subject').value;
      const container = document.getElementById('chapters-list-container');

      let filtered = chaptersData.filter(item => {
        const matchClass = filterClass === 'All' || item.class_level.toString() === filterClass;
        const matchSubject = filterSubject === 'All' || item.subject === filterSubject;
        return matchClass && matchSubject;
      });

      const subjects = ['Physics', 'Chemistry', 'Mathematics'];
      container.innerHTML = '';

      subjects.forEach(sub => {
        const subChapters = filtered.filter(c => c.subject === sub);
        if (subChapters.length === 0) return;

        let completedCount = subChapters.filter(c => c.module && c.pyq && c.test).length;

        let html = `
          <div class="bg-cardDark border border-cardBorder p-4 rounded-xl space-y-3">
            <div class="flex items-center justify-between border-b border-cardBorder pb-2">
              <h3 class="font-bold text-white flex items-center gap-2"><span>📌</span> ${sub}</h3>
              <span class="text-xs text-gray-400 font-mono">${completedCount}/${subChapters.length}</span>
            </div>
            <div class="space-y-2">
        `;

        subChapters.forEach((ch, idx) => {
          html += `
            <div class="flex items-center justify-between text-xs py-1 border-b border-gray-800/40 last:border-0">
              <span class="text-gray-300 font-medium">${idx + 1}. ${ch.name}</span>
              <div class="flex items-center gap-1.5">
                <button onclick="toggleChapterTag(${ch.id}, 'module', ${!ch.module})" class="px-2 py-0.5 rounded text-[10px] font-bold ${ch.module ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/40' : 'bg-gray-800 text-gray-500'}">MODULE</button>
                <button onclick="toggleChapterTag(${ch.id}, 'pyq', ${!ch.pyq})" class="px-2 py-0.5 rounded text-[10px] font-bold ${ch.pyq ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/40' : 'bg-gray-800 text-gray-500'}">PYQs</button>
                <button onclick="toggleChapterTag(${ch.id}, 'test', ${!ch.test})" class="px-2 py-0.5 rounded text-[10px] font-bold ${ch.test ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/40' : 'bg-gray-800 text-gray-500'}">TEST</button>
              </div>
            </div>
          `;
        });

        html += `</div></div>`;
        container.innerHTML += html;
      });
    }

    async function toggleChapterTag(id, field, value) {
      await supabaseClient.from('chapters').update({ [field]: value }).eq('id', id);
      const target = chaptersData.find(c => c.id === id);
      if (target) target[field] = value;
      renderChapters();
      renderDashboard();
    }

    async function addChapter() {
      const name = document.getElementById('new-chap-name').value;
      const class_level = parseInt(document.getElementById('new-chap-class').value);
      const subject = document.getElementById('new-chap-subject').value;

      if (!name) return;

      const { data } = await supabaseClient.from('chapters').insert([{ name, class_level, subject }]).select();
      if (data) chaptersData.push(data[0]);

      document.getElementById('new-chap-name').value = '';
      renderChapters();
      renderDashboard();
    }

    async function addModule() {
      const name = document.getElementById('module-name').value;
      const class_level = parseInt(document.getElementById('module-class').value);
      const subject = document.getElementById('module-subject').value;
      if (!name) return;

      const { data } = await supabaseClient.from('modules').insert([{ name, class_level, subject }]).select();
      if (data) modulesData.push(data[0]);
      document.getElementById('module-name').value = '';
      renderModules();
      renderDashboard();
    }

    function renderModules() {
      const container = document.getElementById('modules-list');
      container.innerHTML = modulesData.map(m => `<div class="p-3 bg-cardDark border border-cardBorder rounded-lg">${m.name} (${m.subject} - Class ${m.class_level})</div>`).join('');
    }

    async function addTest() {
      const name = document.getElementById('test-name').value;
      const total_score = parseInt(document.getElementById('test-score').value) || 0;
      const accuracy = parseFloat(document.getElementById('test-accuracy').value) || 0;
      if (!name) return;

      const { data } = await supabaseClient.from('tests').insert([{ name, total_score, accuracy }]).select();
      if (data) testsData.push(data[0]);
      document.getElementById('test-name').value = '';
      renderTests();
      renderDashboard();
    }

    function renderTests() {
      const container = document.getElementById('tests-list');
      container.innerHTML = testsData.map(t => `<div class="p-3 bg-cardDark border border-cardBorder rounded-lg text-xs text-gray-200"><strong>${t.name}</strong> - Score: ${t.total_score} (${t.accuracy}% acc)</div>`).join('');
    }

    async function addMistake() {
      const concept = document.getElementById('mistake-concept').value;
      const subject = document.getElementById('mistake-subject').value;
      const topic = document.getElementById('mistake-topic').value;
      const reason = document.getElementById('mistake-reason').value;
      if (!concept) return;

      const { data } = await supabaseClient.from('mistakes').insert([{ concept, subject, topic, reason }]).select();
      if (data) mistakesData.push(data[0]);
      document.getElementById('mistake-concept').value = '';
      renderMistakes();
      renderDashboard();
    }

    function renderMistakes() {
      const container = document.getElementById('mistakes-list
